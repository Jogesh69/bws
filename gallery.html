<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gallery | Behali Wildlife Sanctuary</title><meta name="description" content="Official information about Behali Wildlife Sanctuary, Biswanath, Assam.">
<link rel="icon" href="assets/logo-temporary.png"><link rel="stylesheet" href="style.css"></head>
<body data-page="gallery"><div id="site-header"></div><main id="main"><section class="sec"><div class="wrap"><h1>Gallery</h1><p>Photographs from Behali Wildlife Sanctuary, grouped in albums.</p>
<div class="gal-ctl"><div><label for="yearFilter">Year</label><br><select id="yearFilter"><option value="all">All years</option></select></div></div>
<div class="filters" id="categoryFilters"></div>
<div style="display:flex;justify-content:space-between;align-items:baseline"><h2 id="galleryHeading">Albums</h2><span id="albumCount" class="mute"></span></div>
<div class="album-grid" id="albumGrid"></div>
<div id="albumView" hidden><button class="back" id="backAlbums">← Back to all albums</button><span class="eyebrow" id="albumCategory" style="display:block"></span><h2 id="albumTitle"></h2><p id="albumDescription"></p><div class="photo-grid" id="photoGrid"></div></div>
<div class="card" id="galleryEmpty" hidden><h3>No albums found</h3><p>There are no albums in this category.</p></div>
<div class="lb" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer"><button class="x" id="lbClose" aria-label="Close photo viewer">×</button><button class="pv" id="lbPrev" aria-label="Previous photo">‹</button><div><img id="lbImg" src="" alt=""><p id="lbCap"></p></div><button class="nx" id="lbNext" aria-label="Next photo">›</button></div></div></section></main><div id="site-footer"></div><script src="site.js"></script></body></html>
